services:
  timber-v3:
    build: .
    container_name: timber-v3
    ports:
      - "${PORT:-8080}:80"
    volumes:
      # Mount the project for live development
      - .:/var/www/html
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
      - APACHE_LOG_DIR=/var/log/apache2
    restart: unless-stopped
    networks:
      - timber-v3-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

networks:
  timber-v3-network:
    driver: bridge
