name: Publish Chain Lightning to NPM
run-name: Publish Chain Lightning to NPM for "${{ github.event.head_commit.message }}"

on:
  push:
    tags:
      - 'chain-lightning-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for provenance

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: packages/chain-lightning
        run: pnpm install

      - name: Build
        working-directory: packages/chain-lightning
        run: pnpm run build

      - name: Publish to NPM
        working-directory: packages/chain-lightning
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
